services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energyiq-backend
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      - DB_URL=sqlite:////app/data/energyiq.db
      - TARIFF_INR_PER_KWH=8.5
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173"]
    volumes:
      - backend-data:/app/data
      - backend-models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energyiq-frontend
    ports:
      - "5173:5173"
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  backend-models:
